<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cucharita Feliz</title>
    <!-- Tipografía redondeada similar al diseño -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Iconos (FontAwesome) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ENCABEZADO / MAPA DEL SITIO -->

    <!-- CONTENEDOR DINÁMICO DE VISTAS (VACÍO POR AHORA) -->
    <main id="app-content" class="view-container">
      <section id="view-inicio" class="view-section active" data-title="Inicio">
        <!-- Barra superior de la página -->
        <div class="site-navbar">
          <div class="nav-brand" data-route="inicio">
            <i class="fa-solid fa-spoon"></i>
            <span
              ><strong>Cucharita</strong> <em class="text-pink">Feliz</em></span
            >
            <!-- AGREGADO: eslogan -->
            <small class="brand-slogan">
              Una cucharada de felicidad en cada antojo
            </small>
          </div>

          <div class="nav-links">
            <button class="nav-link active" data-route="inicio">Inicio</button>
            <button class="nav-link" data-route="catalogo">Catálogo</button>
            <button class="nav-link" data-route="nosotros">Nosotros</button>
            <button class="nav-link" data-route="contacto">Contacto</button>
          </div>

          <div class="nav-actions">
            <!-- AGREGADO: botón de búsqueda -->
            <button class="icon-btn" title="Buscar" data-route="catalogo">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <button class="icon-btn" title="Mi cuenta">
              <i class="fa-regular fa-user"></i>
            </button>
            <button
              class="icon-btn cart-btn"
              data-route="carrito"
              title="Ver carrito"
            >
              <i class="fa-solid fa-cart-shopping"></i>
              <span class="cart-badge" id="cart-count">0</span>
            </button>
          </div>
        </div>

        <!-- Banner Principal (Hero) -->
        <div class="hero-banner">
          <div class="hero-info">
            <h1>
              Postres que
              <span class="text-pink">endulzan tu día</span>
            </h1>

            <p>
              Deliciosos postres artesanales,<br />
              ideales para compartir.
            </p>

            <button class="btn-pink" data-route="catalogo">
              <i class="fa-solid fa-cart-shopping"></i>
              Comprar ahora
            </button>

            <!-- AGREGADO: decoración de corazón -->
            <i class="fa-regular fa-heart hero-heart"></i>
          </div>

          <div class="hero-visual">
            <div class="hero-plate">
              <i class="fa-solid fa-cake-candles"></i>
              <span>Torta Especial de Chocolate</span>
            </div>

            <!-- AGREGADO: imagen principal -->
            <img
              src="img/hero-postres.png"
              alt="Postres artesanales de Cucharita Feliz"
              class="hero-image"
            />
          </div>
        </div>

        <!-- Sección Nuestros Destacados -->
        <div class="featured-section">
          <h2 class="section-divider">
            <i class="fa-solid fa-cupcake"></i>
            <span>Postres destacados</span>
          </h2>

          <div class="featured-grid" id="featured-list">
            <!-- Se llena automáticamente desde script.js -->
          </div>

          <!-- AGREGADO: indicadores decorativos -->
          <div class="slider-dots">
            <span class="active"></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <!-- AGREGADO: beneficios de la tienda -->
        <div class="benefits-bar">
          <div class="benefit-item">
            <i class="fa-solid fa-cake-candles"></i>
            <strong>Postres<br />artesanales</strong>
          </div>

          <div class="benefit-item">
            <i class="fa-solid fa-truck-fast"></i>
            <strong>Delivery a<br />toda Lima</strong>
          </div>

          <div class="benefit-item">
            <i class="fa-regular fa-credit-card"></i>
            <strong>Pagos<br />seguros</strong>
          </div>
        </div>
      </section>

      <section
        id="view-catalogo"
        class="view-section"
        data-title="Catálogo"
      ></section>
      <section
        id="view-detalle"
        class="view-section"
        data-title="Detalle del Producto"
      ></section>
      <section
        id="view-carrito"
        class="view-section"
        data-title="Carrito"
      ></section>
      <section
        id="view-pedido"
        class="view-section"
        data-title="Finalizar Pedido"
      ></section>
      <section
        id="view-nosotros"
        class="view-section"
        data-title="Nosotros"
      ></section>
      <section
        id="view-contacto"
        class="view-section"
        data-title="Contacto"
      ></section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
